<noscript><div class="container chart-list" style="display:block"><ul><li><a href="installations.html">Installations</a><ul><li>Echo tiles<ul><li><a href="installations.html#mural">Mural</a></li><li><a href="installations.html#wall-pieces">Digital fabricated wall pieces</a></li></ul></li><li>Vizcaya commission<ul><li><a href="installations.html#vizcaya">Installation</a></li><li><a href="installations.html#stopmotion">Stop motion</a></li></ul></li></ul></li><li>FIU: Architecture + Robotics<ul><li>Teaching<ul><li>Digital Architecture studio, Summer 2021 <span class="muted">&mdash; FIU, Year 1 graduate studio: an introduction to digital workflows for architects.</span></li><li>Digital Architecture studio, Fall 2021 <span class="muted">&mdash; FIU, Year 1 graduate studio on data analysis and digital workflows for urban planning strategies and sustainable practices.</span></li><li>Introduction to Computational Design, Spring 2022 <span class="muted">&mdash; FIU, a second design studio for undergraduate students on the basics of architectural computational practices.</span></li><li>Digital Practices studio, Summer 2022 <span class="muted">&mdash; FIU, Year 2 graduate studio. Students dove into ecological research and learned to let it guide building design through computational workflows. Student projects received AIA Miami 2022 Design Awards.</span></li><li>Traveling Studio: Digital Architecture, Fall 2022 <span class="muted">&mdash; FIU, Year 3 study-abroad graduate studio in Genoa, Italy. Ecological research guiding building design through computational workflows.</span></li><li>Technical Drawings of City Infrastructure, Fall 2022 <span class="muted">&mdash; FIU, Year 3 study-abroad graduate studio in Genoa, Italy, on drawing technical field drawings: learning to see buildings with your hands.</span></li><li>Graduate Thesis Studio, Fall 2022 to Spring 2023 <span class="muted">&mdash; FIU. Building on research into architecture for non-humans, the studio focused on the co-habitation of species in Belém and Miami. Students designed objects, buildings and urban systems and showed them in interactive exhibitions. A student won first place at the 2023 Conference of Florida Graduate Schools Statewide Graduate Research Poster Symposium.</span></li><li>3D Printing Biophilic Objects, Summer 2023 <span class="muted">&mdash; FIU. A 3D printing and photogrammetry workshop studio where students designed and made household objects that serve people and the plants that live in them. Shown: Lemon Balm Infuser (Natalia Castillo), Succulent Teapot (Colin Mele), Spanish Moss IKEA Lamp (Rafael Cardero).</span></li></ul></li><li><a href="https://sophia9108.wixsite.com/portfolio">Thesis</a> <span class="muted">&mdash; Artificial corals: my M.Arch thesis on human-made coral reef habitats. A top-five thesis at the FIU School of Architecture (Super Jury award, 2021).</span></li><li><a href="https://carta.fiu.edu/roboticslab/">Robotics lab</a> <span class="muted">&mdash; Research assistant (2019 to 2021) and lab assistant (2019) in FIU&#x27;s Robotics and Digital Fabrication Lab: robotic design-build projects with a KUKA PRC arm, student training, VR/AR environments, and help writing the grants. Led the lab team to first place at the 2019 Climate Champions Hackathon.</span><ul><li><a href="https://carta.fiu.edu/roboticslab/projects/learning-platforms/robotics-academy/index.html">NSF C-Accel: Robotics Academy</a> <span class="muted">&mdash; NSF C-Accel Pilot, Track B1 (AI and Future Jobs): preparing the future workforce of architecture, engineering and construction for robotic automation. A virtual training program that teaches the fundamentals of industrial robot arms using VR. PI Shahin Vassigh, $1,000,000.</span></li><li><a href="https://carta.fiu.edu/roboticslab/projects/learning-platforms/community-connect/index.html">NSF RAPID: Community Connect</a> <span class="muted">&mdash; NSF RAPID grant on mitigating the impacts of COVID-19. Community-Connect is a platform for sustainability resource exchange in post-pandemic smart cities. PI Shahin Vassigh, $150,000.</span></li></ul></li></ul></li><li>Harvard<ul><li>Independent research <span class="muted">&mdash; Coming soon.</span><ul><li>AI + ML for design engineering <span class="muted">&mdash; Coming soon.</span></li><li>AI and art <span class="muted">&mdash; Coming soon.</span></li><li>SVEN <span class="muted">&mdash; Coming soon.</span></li></ul></li><li>Labs<ul><li><a href="https://research.gsd.harvard.edu/maps/">MAP+S</a> <span class="muted">&mdash; Research assistant (2024) with the MaP+S research group on bio-materials for robotic-arm 3D printing. Paper: Toward a Computational Regionalism, a framework for localized bio-composite 3D-printing with natural fibers (ACADIA Vanguard Award runner-up).</span></li><li><a href="https://research.gsd.harvard.edu/grg/">GRG research group</a> <span class="muted">&mdash; Computer vision research associate (2024 to present) with the Grinham Research Group: sensor technologies and computer vision for building technology, including Project VIS, image-based insights for the built environment.</span></li></ul></li><li>Workshops<ul><li>Fabrication workshops <span class="muted">&mdash; Teaching assistant at the Harvard GSD (2024) for Digital Production at Scale. Earlier, at FIU, a 3D printing and photogrammetry workshop studio (summer 2023).</span></li><li>Computer vision workshop <span class="muted">&mdash; Teaching assistant at the Harvard GSD (2024) for Circuits, Circles, and Loops, a course on using machine learning for building analysis.</span></li><li><a href="https://www.food4rhino.com/en/app/seaurchin">Coding for designers workshops</a> <span class="muted">&mdash; Teaching assistant at the Harvard GSD (2024) for Introduction to Computation. Also the author of SeaUrchin, a Grasshopper plug-in written in C#.</span></li></ul></li></ul></li><li>Startup<ul><li><a href="https://www.fixai.tech">Fixai.tech</a> <span class="muted">&mdash; Co-founder and CTO (2024 to present). FixAI builds AI-powered tools for the people who maintain and manage existing buildings. I lead the technical development.</span><ul><li>Enterprise customers <span class="muted">&mdash; FiXA Spend: one view of every community&#x27;s reserves and spending, for HOA and condo managers, property managers and service providers.</span></li></ul></li><li><a href="https://www.heyfixa.com">heyfixa.com</a> <span class="muted">&mdash; The FiXA app for homeowners: snap a photo or describe a repair, get a diagnosis and a cost range, then do it yourself or hire a vetted local pro (Philadelphia and Delaware County).</span><ul><li>Top 10 MIT Venture Lab <span class="muted">&mdash; Named one of the Top 10 Ventures at the MIT Venture Studio (2024) and accepted into the Harvard Innovation Labs program.</span></li></ul></li></ul></li><li>Industry<ul><li><a href="https://www.arquitectonica.com">Arquitectonica</a> <span class="muted">&mdash; Architecture and computation designer at ArquitectonicaGEO (2020 to 2022), in the landscape department: Grasshopper scripts in Python and C# for automation and rapid design iteration, and parametric workflows on large-scale projects.</span></li><li>State Dept., OBO: Building and Construction <span class="muted">&mdash; The Bureau of Overseas Buildings Operations, Office of Building and Construction.</span><ul><li><a href="https://oboportfolio.state.gov/portlouis/">New U.S. Embassy, Port Louis, Mauritius</a></li></ul></li><li><a href="https://www.research.autodesk.com/publications/a-contactless-multi-modal-sensing-approach-for-material-assessment-and-recovery-in-building-deconstruction/">Autodesk</a> <span class="muted">&mdash; Robotic Multi-Modal Researcher (2024). Research on contactless multi-modal sensing for material assessment and recovery in building deconstruction, published in MDPI Sustainability.</span></li></ul></li></ul></div></noscript>
